<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // 主题防闪烁：默认深色，与前台共享 localStorage.theme（v20260822 与前台逻辑统一）
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

      <!-- 主内容 -->
      <main class="main-content">

        <!-- 订单管理 -->

        <!-- 优惠券管理 -->

        <!-- 工单管理 -->

        <!-- 公告管理 -->

        <!-- 管理员管理 -->

        <!-- 操作日志 -->

    </div>
    <!-- 商品编辑弹窗 -->
    <div data-partial="../partials/admin/modals/product.html"></div>
    <!-- 优惠券编辑弹窗 -->
    <div data-partial="../partials/admin/modals/coupon.html"></div>
    <!-- 订单详情弹窗 -->

    <!-- 公告编辑弹窗 -->

    <!-- 新增管理员弹窗 -->
    <div data-partial="../partials/admin/modals/admin-new.html"></div>
    <!-- 数据库更新提示弹窗 -->
    <div data-partial="../partials/admin/modals/db-update.html"></div>

    <!-- ========== 基础层：公共工具 ========== -->

    <script>
      // 后台主题切换（与前台共享 localStorage.theme）
      function updateAdminThemeIcon(isDark) {
        var icon = document.getElementById("adminThemeIcon");
        if (!icon) return;
        icon.innerHTML = isDark
          ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
          : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
      }
      function toggleAdminTheme() {
        var isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        updateAdminThemeIcon(isDark);
      }
      updateAdminThemeIcon(
        document.documentElement.classList.contains("dark")
      );

      // 用户菜单开关（与前台一致：同步旋转胶囊箭头）
      var _origToggleUserMenu = window.toggleUserMenu;
      window.toggleUserMenu = function (event) {
        if (typeof _origToggleUserMenu === "function") _origToggleUserMenu(event);
        var btn = document.getElementById("userMenuBtn");
        var menu = document.getElementById("userMenu");
        if (btn && menu) btn.classList.toggle("open", menu.classList.contains("show"));
      };
      var _origCloseUserMenu = window.closeUserMenu;
      window.closeUserMenu = function () {
        if (typeof _origCloseUserMenu === "function") _origCloseUserMenu();
        var btn = document.getElementById("userMenuBtn");
        if (btn) btn.classList.remove("open");
      };

      // 内容区滚动时头部加投影 + 背景加深（对齐前台 .header.scrolled）
      (function () {
        var header = document.getElementById("topHeader");
        var main = document.querySelector(".main-content");
        if (!header || !main) return;
        main.addEventListener("scroll", function () {
          header.classList.toggle("scrolled", main.scrollTop > 4);
        }, { passive: true });
      })();
    </script>
  </body>
</html>
