<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理登录 - VPS积分商城</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css?v=20261113">
    <script>
        // 主题防闪烁：默认深色，与前台共享 localStorage.theme（v20260822 与前台逻辑统一）
        (function () {
            try {
                if (localStorage.getItem("theme") === "light") {
                    document.documentElement.classList.remove("dark");
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="auth-page">
    <div class="auth-layout">
        <div class="auth-card">
            <div style="text-align:center;margin-bottom:30px">
                <div class="auth-brand-badge">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <h1 class="auth-title">管理后台登录</h1>
                <p class="auth-subtitle">请使用管理员账号登录系统</p>
            </div>

            <div class="form-group" style="margin-bottom:20px">
                <label class="auth-field-label" for="username">用户名</label>
                <input type="text" id="username" class="auth-input" placeholder="请输入管理员用户名" autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom:26px">
                <label class="auth-field-label" for="password">密码</label>
                <input type="password" id="password" class="auth-input" placeholder="请输入密码" autocomplete="current-password">
            </div>

            <button class="btn btn-primary" id="adminLoginBtn" style="width:100%;padding:11px;font-size:14px" onclick="doLogin()">
                立即登录
            </button>

            <div style="text-align:center;margin-top:22px">
                <a href="../index.html" class="auth-footer-link">← 返回商城首页</a>
            </div>
        </div>
    </div>

    <script src="../js/core/common.js?v=20261113d"></script>
    <script>
        window.__apiBase = '../';
        initCsrfToken('../');

        // 检查安装状态
        apiFetch('../api/check_install.php?_=' + Date.now())
            .then(r => r.json())
            .then(data => {
                if (data.code === 1) {
                    if (!data.data.config_ok || !data.data.tables_ok) {
                        window.location.replace('install.html');
                    } else if (!data.data.admin_ok) {
                        window.location.replace('setup.html');
                    }
                }
            });

        // 检查是否已登录
        apiFetch('../api/admin.php?action=check')
            .then(r => r.json())
            .then(data => {
                if (data.code === 1) {
                    window.location.replace('index.html');
                }
            });

        function doLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('adminLoginBtn');

            if (!user || !pass) {
                showToast('请填写用户名和密码', 'warning');
                return;
            }

            if (btn) { btn.disabled = true; btn.textContent = '登录中…'; }
            const body = new FormData();
            body.append('action', 'login');
            body.append('username', user);
            body.append('password', pass);

            apiFetch('../api/admin.php', { method: 'POST', body })
                .then(r => r.json())
                .then(data => {
                    if (data.code === 1) {
                        showToast('登录成功，正在进入控制台', 'success');
                        window.location.replace('index.html');
                    } else {
                        showToast(data.msg || '登录失败', 'error');
                        if (btn) { btn.disabled = false; btn.textContent = '立即登录'; }
                    }
                })
                .catch(() => {
                    showToast('网络请求失败，请重试', 'error');
                    if (btn) { btn.disabled = false; btn.textContent = '立即登录'; }
                });
        }

        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('username').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
