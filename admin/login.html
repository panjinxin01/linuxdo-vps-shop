<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理登录 - VPS积分商城</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css?v=20260822">
    <script>
        // 主题防闪烁：默认深色，与前台共享 localStorage.theme（v20260822 与前台逻辑统一）
        (function () {
            try {
                if (localStorage.getItem("theme") === "light") {
                    document.documentElement.classList.remove("dark");
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="auth-page">
    <div class="auth-layout">
        <div class="auth-card">
            <div style="text-align:center;margin-bottom:30px">
                <div class="auth-brand-badge">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <h1 class="auth-title">管理后台登录</h1>
                <p class="auth-subtitle">请使用管理员账号登录系统</p>
            </div>

            <div class="form-group" style="margin-bottom:20px">
                <label class="auth-field-label" for="username">用户名</label>
                <input type="text" id="username" class="auth-input" placeholder="请输入管理员用户名" autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom:26px">
                <label class="auth-field-label" for="password">密码</label>
                <input type="password" id="password" class="auth-input" placeholder="请输入密码" autocomplete="current-password">
            </div>

            <button class="btn btn-primary" style="width:100%;padding:12px;font-size:14px" onclick="doLogin()">
                立即登录
            </button>

            <div style="text-align:center;margin-top:26px">
                <a href="../index.html" class="auth-footer-link">← 返回商城首页</a>
            </div>
        </div>
    </div>

    <script>
        let csrfToken = '';
        function initCsrfToken() {
            return window.fetch('../api/csrf.php', { credentials: 'same-origin' })
                .then(r => r.json())
                .then(data => {
                    if (data.code === 1 && data.data && data.data.token) {
                        csrfToken = data.data.token;
                    }
                })
                .catch(() => {});
        }

        function apiFetch(url, options = {}) {
            const opts = { credentials: 'same-origin', ...options };
            const method = (opts.method || 'GET').toUpperCase();
            const ensureToken = (!csrfToken && method !== 'GET' && method !== 'HEAD') ? initCsrfToken() : Promise.resolve();
            return ensureToken.then(() => {
                const headers = new Headers(opts.headers || {});
                if (csrfToken && !headers.has('X-CSRF-Token')) {
                    headers.set('X-CSRF-Token', csrfToken);
                }
                opts.headers = headers;
                return window.fetch(url, opts);
            });
        }

        initCsrfToken();

        // 检查安装状态
        apiFetch('../api/check_install.php?_=' + Date.now())
            .then(r => r.json())
            .then(data => {
                if (data.code === 1) {
                    if (!data.data.config_ok || !data.data.tables_ok) {
                        window.location.replace('install.html');
                    } else if (!data.data.admin_ok) {
                        window.location.replace('setup.html');
                    }
                }
            });

        // 检查是否已登录
        apiFetch('../api/admin.php?action=check')
            .then(r => r.json())
            .then(data => {
                if (data.code === 1) {
                    window.location.replace('index.html');
                }
            });

        function doLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            if (!user || !pass) {
                alert('请填写完整');
                return;
            }

            const body = new FormData();
            body.append('action', 'login');
            body.append('username', user);
            body.append('password', pass);

            apiFetch('../api/admin.php', { method: 'POST', body })
                .then(r => r.json())
                .then(data => {
                    if (data.code === 1) {
                        window.location.replace('index.html');
                    } else {
                        alert(data.msg);
                    }
                });
        }

        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('username').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
