<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090c12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="description" content="VPS积分商城 - 登录你的账户，管理云端资源与服务" />
    <title>登录 - VPS积分商城</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script>
      // 防主题闪烁：在渲染前恢复主题（默认深色）
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="css/pages/login.css?v=20261113" />
  </head>
  <body>
    <!-- ==================== 顶栏 ==================== -->
    <header class="topbar">
      <a class="brand" href="index.html">
        <div class="brand-icon" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>
          </svg>
        </div>
        <span class="brand-name">VPS兑换</span>
      </a>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" title="设置" aria-label="设置" onclick="openSettings()">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="icon-btn" type="button" id="themeToggle" title="切换暗黑模式" aria-label="切换暗黑模式" onclick="toggleTheme()">
          <svg id="themeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ==================== 登录卡片 ==================== -->
    <main class="login-main">
      <div class="login-card">
        <h1 class="login-title" id="formTitle">欢迎回来</h1>
        <p class="login-subtitle" id="formSubtitle">登录你的账户，管理云端资源与服务。</p>

        <div class="notice">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div class="notice-body">
            <div class="notice-title">系统公告</div>
            <div class="notice-content">若在登录过程中遇到异常情况，可使用账户关联邮箱联系站点管理员寻求帮助。</div>
          </div>
        </div>

        <div class="msg-tip" id="msgTip"></div>

        <form id="authForm" onsubmit="doAuth(event)">
          <div class="form-group">
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input type="text" id="authUser" placeholder="用户名" autocomplete="username" />
            </div>
          </div>

          <div class="form-group">
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="authPass" placeholder="密码" autocomplete="current-password" />
              <button class="input-eye" type="button" id="passEye" aria-label="显示密码" onclick="togglePassVisible()">
                <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group" id="emailGroup">
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input type="email" id="authEmail" placeholder="邮箱（选填，用于找回密码）" autocomplete="email" />
            </div>
          </div>

          <label class="remember-row">
            <input type="checkbox" id="publicPc" />
            <span>我正在使用公共电脑或网络</span>
          </label>

          <button class="btn-primary" type="submit" id="authBtn">登录</button>

          <div id="oauthDivider" class="oauth-divider" style="display: none"><span>或</span></div>
          <button id="linuxdoLoginBtn" class="btn-linuxdo" type="button" style="display: none" onclick="loginWithLinuxDO()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            使用 Linux DO 登录
          </button>
        </form>

        <div class="login-foot">
          <a class="foot-link" href="#" id="switchLink" onclick="switchMode(event)">创建账户</a>
          <a class="foot-link" href="admin/login.html">管理后台</a>
          <a class="foot-link" href="#" onclick="forgotPassword(event)">找回密码</a>
        </div>
      </div>
    </main>

    <!-- ==================== 设置弹窗 ==================== -->
    <div class="modal-mask" id="settingsMask" onclick="closeSettings()"></div>
    <div class="settings-modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-head">
        <span id="settingsTitle">设置</span>
        <button class="settings-close" type="button" aria-label="close" onclick="closeSettings()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="settings-row">
          <span>减弱动画效果</span>
          <button class="n-switch" id="motionSwitch" type="button" role="switch" aria-checked="false" onclick="toggleReduceMotion()">
            <span class="rail-btn"></span>
          </button>
        </div>
      </div>
    </div>

    <script src="js/core/common.js?v=20261113d"></script>
    <script src="js/front/login.js?v=20261113d"></script>
  </body>
</html>
