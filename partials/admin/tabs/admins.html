<!-- 管理员管理 tab -->
<!-- 来源：admin/index.html · 由 js/core/partials.js 同步注入，请勿在此文件内写 <script> -->
        <!-- 管理员管理 -->
        <div class="tab-content" id="admins">
          <div class="page-header">
            <h1 class="page-title">管理员管理</h1>
            <div class="page-actions">
              <button class="btn btn-primary" onclick="showAddAdmin()">
                + 添加管理员
              </button>
            </div>
          </div>
          <div class="admin-split-grid">
            <div class="table-container">
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>用户名</th>
                      <th>角色</th>
                      <th>创建时间</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="adminTable">
                    <tr>
                      <td colspan="5" class="empty">加载中...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="card" style="padding: 24px">
              <h3 style="margin-bottom: 16px">提权已有用户</h3>
              <div class="form-group">
                <label>搜索用户</label
                ><input
                  type="text"
                  id="promoteUserKeyword"
                  placeholder="用户名 / 邮箱 / Linux DO"
                  oninput="loadPromotableUsers()"
                />
              </div>
              <div class="form-group">
                <label>提权后角色</label
                ><select id="promoteUserRole">
                  <option value="admin">普通管理员</option>
                  <option value="super">超级管理员</option>
                </select>
              </div>
              <div class="form-group">
                <label>管理员密码（可留空沿用用户现有密码）</label
                ><input
                  type="password"
                  id="promoteUserPassword"
                  placeholder="该用户没本地密码时必填"
                />
              </div>
              <div class="table-wrapper" style="max-height: 340px">
                <table>
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>用户</th>
                      <th>状态</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="promoteUserTable">
                    <tr>
                      <td colspan="4" class="empty">输入关键词后搜索</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
