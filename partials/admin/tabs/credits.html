<!-- 积分管理 tab -->
<!-- 来源：admin/index.html · 由 js/core/partials.js 同步注入，请勿在此文件内写 <script> -->
        <!-- 积分管理 -->
        <div class="tab-content" id="credits">
          <div class="page-header">
            <h1 class="page-title">积分管理</h1>
            <div class="page-actions">
              <button class="btn btn-outline" onclick="loadCreditAdminUsers()">
                刷新
              </button>
            </div>
          </div>
          <div class="settings-grid">
            <div class="card" style="padding: 24px">
              <div class="form-group">
                <label>搜索用户</label
                ><input
                  type="text"
                  id="creditSearchKeyword"
                  placeholder="用户名 / Linux DO ID"
                  oninput="loadCreditAdminUsers()"
                />
              </div>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>用户</th>
                      <th>Linux DO</th>
                      <th>余额</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="creditUserTable">
                    <tr>
                      <td colspan="5" class="empty">加载中...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="card" style="padding: 24px">
              <h3 style="margin-bottom: 16px">手动加减积分</h3>
              <div class="form-group">
                <label>用户ID</label><input type="number" id="creditUserId" />
              </div>
              <div class="form-group">
                <label>金额（正数=增加，负数=扣减）</label
                ><input type="number" id="creditAmount" step="0.01" />
              </div>
              <div class="form-group">
                <label>备注</label
                ><input
                  type="text"
                  id="creditRemark"
                  placeholder="如：售后补偿 / 人工扣减"
                />
              </div>
              <button class="btn btn-primary" onclick="submitCreditAdjust()">
                提交调整
              </button>
              <div style="margin-top: 20px" class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>时间</th>
                      <th>用户</th>
                      <th>类型</th>
                      <th>变动</th>
                      <th>备注</th>
                    </tr>
                  </thead>
                  <tbody id="creditTxnTable">
                    <tr>
                      <td colspan="5" class="empty">加载中...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
