<!-- 订单管理 tab -->
<!-- 来源：admin/index.html · 由 js/core/partials.js 同步注入，请勿在此文件内写 <script> -->
        <!-- 订单管理 -->
        <div class="tab-content" id="orders">
          <div class="page-header">
            <h1 class="page-title">订单管理</h1>
            <div class="page-actions">
              <button class="btn btn-outline" onclick="exportData('orders')">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 导出CSV
              </button>
              <button
                class="btn btn-outline"
                onclick="batchDeleteOrders('expired')"
              >
                清理已取消
              </button>
              <button
                class="btn btn-outline"
                onclick="batchDeleteOrders('pending')"
              >
                清理待支付
              </button>
            </div>
          </div>
          <div class="admin-filter-bar">
            <div class="admin-filter-tabs" id="adminOrderFilterTabs">
              <button type="button" class="admin-filter-tab active" data-filter="all" onclick="setAdminOrderFilter('all', this)">全部订单</button>
              <button type="button" class="admin-filter-tab" data-filter="paid_waiting" onclick="setAdminOrderFilter('paid_waiting', this)">待开通</button>
              <button type="button" class="admin-filter-tab" data-filter="pending_pay" onclick="setAdminOrderFilter('pending_pay', this)">待支付</button>
              <button type="button" class="admin-filter-tab" data-filter="delivered" onclick="setAdminOrderFilter('delivered', this)">已交付</button>
              <button type="button" class="admin-filter-tab" data-filter="exception" onclick="setAdminOrderFilter('exception', this)">异常</button>
              <button type="button" class="admin-filter-tab" data-filter="refunded" onclick="setAdminOrderFilter('refunded', this)">已退款</button>
            </div>
            <div class="admin-search-wrap">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" class="admin-search-input" id="orderSearchInput" placeholder="搜索订单号 / 商品 / 用户名..." oninput="filterAdminOrdersClient()" />
            </div>
          </div>
          <div class="table-container">
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>订单号</th>
                    <th>商品</th>
                    <th>用户</th>
                    <th>金额</th>
                    <th>状态</th>
                    <th>时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="orderTable">
                  <tr>
                    <td colspan="7" class="empty">加载中...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
