<!-- 系统设置 tab（支付 / LDC Pay / OAuth / SMTP / 缓存 / 通知 / AI 配置） -->
<!-- 来源：admin/index.html · 由 js/core/partials.js 同步注入 -->
        <!-- 系统设置 -->
        <div class="tab-content" id="settings">
          <div class="page-header"><h1 class="page-title">系统设置</h1></div>
          <div class="settings-scroll-container">
            <div class="settings-grid">
              <div class="card" style="padding: 24px">
                <h3
                  style="
                    margin-bottom: 20px;
                    font-size: 16px;
                    color: var(--text-main);
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                >
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> 支付配置
                </h3>
                <div class="form-group">
                  <label>PID (Client ID)</label
                  ><input
                    type="text"
                    id="cfgPid"
                    placeholder="从Linux DO控制台获取"
                  />
                </div>
                <div class="form-group">
                  <label>Key (Client Secret)</label
                  ><input
                    type="password"
                    id="cfgKey"
                    placeholder="从Linux DO控制台获取"
                  />
                </div>
                <div class="form-group">
                  <label>异步回调地址</label
                  ><input
                    type="text"
                    id="cfgNotify"
                    placeholder="https://yourdomain.com/api/notify.php"
                  />
                </div>
                <div class="form-group">
                  <label>支付成功跳转</label
                  ><input
                    type="text"
                    id="cfgReturn"
                    placeholder="https://yourdomain.com/"
                  />
                </div>
                <button class="btn btn-primary" onclick="savePaySettings()">
                  保存支付配置
                </button>
              </div>
              <div class="card" style="padding: 24px">
                <h3
                  style="
                    margin-bottom: 20px;
                    font-size: 16px;
                    color: var(--text-main);
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                >
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> LDC Pay (Ed25519 签名支付)
                </h3>
                <p
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    margin-bottom: 14px;
                  "
                >
                  Linux DO Credit Pay 接口配置，使用 Ed25519 非对称签名验证
                </p>
                <div id="ldcPayEd25519Hint" style="padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:14px;"></div>
                <div class="form-group">
                  <label>Client ID (PID)</label
                  ><input
                    type="text"
                    id="cfgLdcClientId"
                    placeholder="从 Linux DO 支付后台获取"
                  />
                </div>
                <div class="form-group">
                  <label>Client Secret (密钥)</label
                  ><input
                    type="password"
                    id="cfgLdcClientSecret"
                    placeholder="从 Linux DO 支付后台获取"
                  />
                </div>
                <div class="form-group">
                  <label>Ed25519 Private Key (私钥 Base64, 32字节)</label
                  ><input
                    type="password"
                    id="cfgLdcPrivateKey"
                    placeholder="用于请求签名，Base64 编码的 32 字节私钥"
                  />
                </div>
                <div class="form-group">
                  <label>Ed25519 Public Key (公钥 Base64, 32字节)</label
                  ><input
                    type="text"
                    id="cfgLdcPublicKey"
                    placeholder="用于回调验签，Base64 编码的 32 字节公钥"
                  />
                </div>
                <div class="form-group">
                  <label>异步回调地址</label
                  ><input
                    type="text"
                    id="cfgLdcNotify"
                    placeholder="https://yourdomain.com/api/notify.php"
                  />
                </div>
                <div class="form-group">
                  <label>支付成功跳转</label
                  ><input
                    type="text"
                    id="cfgLdcReturn"
                    placeholder="https://yourdomain.com/"
                  />
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
                  <button class="btn btn-primary" onclick="saveLdcPaySettings()">
                    保存 LDC Pay 配置
                  </button>
                  <button class="btn btn-outline" onclick="generateEd25519Keypair()">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> 生成 Ed25519 密钥对
                  </button>
                </div>
              </div>
              <div class="card" style="padding: 24px">
                <h3
                  style="
                    margin-bottom: 20px;
                    font-size: 16px;
                    color: var(--text-main);
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                >
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> OAuth登录配置
                </h3>
                <p
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    margin-bottom: 14px;
                  "
                >
                  配置后用户可使用Linux DO账号一键登录
                </p>
                <div class="form-group">
                  <label>Client ID</label
                  ><input
                    type="text"
                    id="cfgOAuthClientId"
                    placeholder="从Linux DO Connect获取"
                  />
                </div>
                <div class="form-group">
                  <label>Client Secret</label
                  ><input
                    type="password"
                    id="cfgOAuthClientSecret"
                    placeholder="从Linux DO Connect获取"
                  />
                </div>
                <div class="form-group">
                  <label>回调地址</label
                  ><input
                    type="text"
                    id="cfgOAuthRedirectUri"
                    placeholder="https://yourdomain.com/api/oauth.php?action=callback"
                  />
                </div>
                <button class="btn btn-primary" onclick="saveOAuthSettings()">
                  保存登录配置
                </button>
                <button
                  class="btn btn-outline"
                  style="margin-left: 10px"
                  onclick="migrateLinuxDOFields()"
                >
                  迁移字段
                </button>
              </div>
              <div class="card" style="padding: 24px">
                <h3
                  style="
                    margin-bottom: 20px;
                    font-size: 16px;
                    color: var(--text-main);
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                >
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> 邮件配置 (SMTP)
                </h3>
                <p
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    margin-bottom: 14px;
                  "
                >
                  用于发送密码重置和邮箱验证邮件
                </p>
                <div class="form-group">
                  <label>SMTP服务器</label
                  ><input
                    type="text"
                    id="cfgSmtpHost"
                    placeholder="smtp.example.com"
                  />
                </div>
                <div class="form-group">
                  <label>SMTP端口</label
                  ><input
                    type="number"
                    id="cfgSmtpPort"
                    placeholder="587"
                    value="587"
                  />
                </div>
                <div class="form-group">
                  <label>SMTP用户名</label
                  ><input type="text" id="cfgSmtpUser" placeholder="邮箱地址" />
                </div>
                <div class="form-group">
                  <label>SMTP密码</label
                  ><input
                    type="password"
                    id="cfgSmtpPass"
                    placeholder="邮箱密码或授权码"
                  />
                </div>
                <div class="form-group">
                  <label>发件人邮箱</label
                  ><input
                    type="text"
                    id="cfgSmtpFrom"
                    placeholder="noreply@example.com"
                  />
                </div>
                <div class="form-group">
                  <label>发件人名称</label
                  ><input type="text" id="cfgSmtpName" placeholder="VPS商城" />
                </div>
                <div class="form-group">
                  <label>加密方式</label>
                  <select
                    id="cfgSmtpSecure"
                    style="
                      width: 100%;
                      padding: 10px;
                      border: 1px solid var(--border);
                      border-radius: 8px;
                      background: var(--bg-main);
                      color: var(--text-main);
                    "
                  >
                    <option value="tls">TLS (推荐)</option>
                    <option value="ssl">SSL</option>
                    <option value="">无</option>
                  </select>
                </div>
                <button class="btn btn-primary" onclick="saveSmtpSettings()">
                  保存邮件配置</button
                ><button
                  class="btn btn-outline"
                  style="margin-left: 10px"
                  onclick="testSmtpSettings()"
                >
                  测试发送
                </button>
              </div>
              <div class="card" style="padding: 24px">
                <h3
                  style="
                    margin-bottom: 20px;
                    font-size: 16px;
                    color: var(--text-main);
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                >
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> 通知中心配置
                </h3>
                <div class="form-group">
                  <label
                    ><input
                      type="checkbox"
                      id="cfgNotifEmail"
                      style="width: auto; margin-right: 8px"
                    />启用邮件通知</label
                  >
                </div>
                <div class="form-group">
                  <label
                    ><input
                      type="checkbox"
                      id="cfgNotifWebhook"
                      style="width: auto; margin-right: 8px"
                    />启用 Webhook 通知</label
                  >
                </div>
                <div class="form-group">
                  <label>Webhook 地址</label
                  ><input
                    type="text"
                    id="cfgNotifWebhookUrl"
                    placeholder="https://example.com/webhook"
                  />
                </div>
                <div class="form-group">
                  <label>silenced 用户下单策略</label
                  ><select id="cfgSilencedOrderMode">
                    <option value="review">进入人工审核</option>
                    <option value="block">禁止下单</option>
                  </select>
                </div>
                <button
                  class="btn btn-primary"
                  onclick="saveNotificationSettings()"
                >
                  保存通知配置
                </button>
               </div>
              <!-- AI 配置 -->
              <div class="card" style="padding: 24px">
                <h3
                  style="
                    margin-bottom: 20px;
                    font-size: 16px;
                    color: var(--text-main);
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                >
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M12 2a10 10 0 0 1 10 10c0 5-4 9-10 10S2 17 2 12 7 2 12 2z"/><path d="M8 12l2 2 4-4"/></svg> AI 智能生成配置
                </h3>
                <p
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    margin-bottom: 14px;
                  "
                >
                  配置 OpenAI 兼容 API 后，可在商品管理中通过自然语言描述自动生成商品配置
                </p>
                <div class="form-group">
                  <label>API 地址</label
                  ><input
                    type="text"
                    id="cfgAiEndpoint"
                    placeholder="https://api.openai.com/v1"
                  />
                </div>
                <div class="form-group">
                  <label>API Key</label
                  ><input
                    type="password"
                    id="cfgAiKey"
                    placeholder="sk-..."
                  />
                </div>
                <div class="form-group">
                  <label>模型名称</label
                  ><input
                    type="text"
                    id="cfgAiModel"
                    placeholder="gpt-4o-mini"
                  />
                </div>
                <button class="btn btn-primary" onclick="saveAiSettings()">
                  保存 AI 配置
                </button>
              </div>
              <div class="card" style="padding: 24px">
                <h3
                  style="
                    margin-bottom: 20px;
                    font-size: 16px;
                    color: var(--text-main);
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                >
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> 修改密码
                </h3>
                <div class="form-group">
                  <label>原密码</label><input type="password" id="oldPass" />
                </div>
                <div class="form-group">
                  <label>新密码</label
                  ><input type="password" id="newPass" placeholder="至少6位" />
                </div>
                <button class="btn btn-primary" onclick="changePassword()">
                  修改密码
                </button>
              </div>
              <div class="card" style="padding: 24px">
                <h3
                  style="
                    margin-bottom: 20px;
                    font-size: 16px;
                    color: var(--text-main);
                    display: flex;
                    align-items: center;
                    gap: 8px;
                  "
                >
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:4px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> 缓存管理
                </h3>
                <p
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    margin-bottom: 14px;
                  "
                >
                  文件缓存用于提高页面加载速度
                </p>
                <div
                  id="cacheStats"
                  style="
                    margin-bottom: 16px;
                    padding: 12px;
                    background: var(--bg-main);
                    border-radius: 8px;
                    font-size: 13px;
                  "
                >
                  <span>缓存文件: <strong id="cacheCount">-</strong></span>
                  <span style="margin-left: 16px"
                    >占用空间: <strong id="cacheSize">-</strong></span
                  >
                  <span style="margin-left: 16px"
                    >已过期: <strong id="cacheExpired">-</strong></span
                  >
                </div>
                <button class="btn btn-outline" onclick="loadCacheStats()">
                  刷新统计
                </button>
                <button
                  class="btn btn-outline"
                  style="margin-left: 10px"
                  onclick="cleanupCache()"
                >
                  清理过期
                </button>
                <button
                  class="btn btn-danger"
                  style="margin-left: 10px"
                  onclick="clearAllCache()"
                >
                  清空全部
                </button>
              </div>
            </div>
          </div>
        </div>
