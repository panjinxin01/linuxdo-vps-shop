<!-- 工单管理 tab（列表 ⇄ 详情子视图） -->
<!-- 来源：admin/index.html · 由 js/core/partials.js 同步注入，请勿在此文件内写 <script> -->
        <!-- 工单管理（v20260825 · 列表 ⇄ 详情子视图切换） -->
        <div class="tab-content" id="tickets">
          <div id="tkAdminListWrap">
          <div class="page-header">
            <h1 class="page-title">工单管理</h1>
            <div class="page-actions">
              <button class="btn btn-outline" onclick="exportData('tickets')">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:2px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 导出CSV
              </button>
            </div>
          </div>
          <div class="stats-grid" style="margin-bottom: 20px">
            <div class="stat-card warning">
              <div class="stat-header"><div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div></div>
              <div class="stat-label">待回复</div>
              <div class="stat-value" id="statTicketPending">-</div>
            </div>
            <div class="stat-card success">
              <div class="stat-header"><div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div></div>
              <div class="stat-label">已回复</div>
              <div class="stat-value" id="statTicketReplied">-</div>
            </div>
            <div class="stat-card">
              <div class="stat-header"><div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div></div>
              <div class="stat-label">已关闭</div>
              <div class="stat-value" id="statTicketClosed">-</div>
            </div>
            <div class="stat-card primary">
              <div class="stat-header"><div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div></div>
              <div class="stat-label">总工单</div>
              <div class="stat-value" id="statTicketTotal">-</div>
            </div>
          </div>

          <!-- 工单筛选栏（v20260824：状态改为分段按钮组，与 tkFilterStatus 双向同步） -->
          <div class="tk-filter-bar">
            <div class="tk-seg-group" id="tkSegStatus" role="group" aria-label="按状态筛选">
              <button type="button" class="tk-seg-btn is-active" data-value="" aria-pressed="true" onclick="setAdminTicketStatusFilter('')">全部</button>
              <button type="button" class="tk-seg-btn" data-value="0" aria-pressed="false" onclick="setAdminTicketStatusFilter('0')">待回复</button>
              <button type="button" class="tk-seg-btn" data-value="1" aria-pressed="false" onclick="setAdminTicketStatusFilter('1')">已回复</button>
              <button type="button" class="tk-seg-btn" data-value="2" aria-pressed="false" onclick="setAdminTicketStatusFilter('2')">已关闭</button>
            </div>
            <select id="tkFilterStatus" hidden onchange="applyTicketFilters()" aria-label="按状态筛选（隐藏兼容保留）">
              <option value="">全部状态</option>
              <option value="0">待回复</option>
              <option value="1">已回复</option>
              <option value="2">已关闭</option>
            </select>
            <select id="tkFilterCategory" onchange="applyTicketFilters()" aria-label="按分类筛选">
              <option value="">全部分类</option>
              <option value="login_issue">登录异常</option>
              <option value="credential_error">凭据错误</option>
              <option value="delivery_issue">发货异常</option>
              <option value="payment_issue">支付问题</option>
              <option value="refund_request">退款申请</option>
              <option value="other">其他</option>
            </select>
            <select id="tkFilterPriority" onchange="applyTicketFilters()" aria-label="按优先级筛选">
              <option value="">全部优先级</option>
              <option value="3">紧急</option>
              <option value="2">高</option>
              <option value="1">中</option>
              <option value="0">低</option>
            </select>
            <input type="search" id="tkFilterKeyword" placeholder="搜索工单标题 / 用户名…" onkeydown="if(event.key==='Enter')applyTicketFilters()" aria-label="搜索工单" />
            <button type="button" class="tk-filter-reset" onclick="resetTicketFilters()">重置</button>
          </div>
          <div class="table-container">
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>标题</th>
                    <th>用户</th>
                    <th>关联订单</th>
                    <th>状态</th>
                    <th>更新时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="ticketTable">
                  <tr>
                    <td colspan="7" class="empty">加载中...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          </div><!-- /tkAdminListWrap -->

          <!-- 工单详情子视图（v20260825 · tab 内嵌页面化详情，替代弹窗） -->
          <div id="ticketAdminView" style="display: none">
            <button type="button" class="tk-back-link" onclick="closeAdminTicketView()">← 返回工单列表</button>
            <div class="card" style="padding: 22px; margin-top: 12px" id="ticketAdminViewBody"></div>
          </div>
        </div>
