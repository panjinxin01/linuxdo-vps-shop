<!-- 购买确认弹窗（含优惠券区） -->
<!-- 来源：index.html · 由 js/core/partials.js 同步注入，请勿在此文件内写 <script> -->
    <!-- ==================== 购买确认弹窗 ==================== -->
    <div class="modal-bg" id="buyModal">
      <div class="modal">
        <div class="modal-head">
          <h3>确认购买</h3>
          <button class="modal-close" onclick="closeBuy()" aria-label="关闭">&times;</button>
        </div>
        <div class="modal-body">
          <div class="summary" id="orderSummary"></div>

          <!-- 优惠券区域 -->
          <div class="coupon-section">
            <label class="coupon-label">优惠券</label>
            <div class="coupon-input-group">
              <input type="text" id="couponCode" placeholder="请输入优惠券码" />
              <button class="btn btn-outline" style="padding: 0 16px" onclick="validateCoupon()">验证</button>
            </div>
            <div class="coupon-msg" id="couponMsg"></div>
          </div>

          <div class="balance-tip-box" id="buyBalanceBox">
            当前余额：<strong id="buyBalanceAmount">--</strong>
            <div style="margin-top: 6px">支持「优惠券后再余额支付」，余额不足时可继续使用 Linux DO Credit 积分支付。</div>
          </div>

          <p class="pay-hint">可选择余额支付或跳转 Linux DO Credit 进行外部支付。<br />支付成功后自动进入交付流程。</p>
        </div>
        <div class="modal-foot buy-foot">
          <button class="btn btn-outline" style="flex: 1" onclick="closeBuy()">取消</button>
          <button class="btn btn-outline" style="flex: 1" onclick="confirmBuy('balance')">余额支付</button>
          <button class="btn btn-primary" style="flex: 1" onclick="confirmBuy('epay')">积分支付</button>
        </div>
      </div>
    </div>
