<!-- 退款申请弹窗 -->
<!-- 来源：index.html · 由 js/core/partials.js 同步注入，请勿在此文件内写 <script> -->
    <!-- ==================== 退款申请弹窗 ==================== -->
    <div class="modal-bg" id="refundModal">
      <div class="modal" style="max-width: 560px">
        <div class="modal-head">
          <h3>申请退款</h3>
          <button class="modal-close" onclick="closeRefundModal()" aria-label="关闭">&times;</button>
        </div>
        <div class="modal-body">
          <div class="refund-summary-card">
            <div class="refund-summary-head">
              <div>
                <div class="refund-summary-label">订单号</div>
                <div class="refund-summary-value" id="refundModalOrderNo">-</div>
              </div>
              <div style="text-align: right">
                <div class="refund-summary-label">退款金额</div>
                <div class="refund-summary-value" id="refundModalAmount">-</div>
              </div>
            </div>
            <div class="refund-summary-tip">提交后会生成退款工单，管理员同意后自动退款。</div>
          </div>
          <input type="hidden" id="refundOrderId" />
          <div class="form-group">
            <label>退款到哪里 *</label>
            <div class="refund-option-list">
              <label class="refund-option-card">
                <input type="radio" name="refundTarget" value="original" checked />
                <div>
                  <div class="refund-option-title">原路退回</div>
                  <div class="refund-option-desc">退回到原支付路径 / 原钱包</div>
                </div>
              </label>
              <label class="refund-option-card">
                <input type="radio" name="refundTarget" value="balance" />
                <div>
                  <div class="refund-option-title">退回站内余额</div>
                  <div class="refund-option-desc">退款后可继续在站内购买</div>
                </div>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label>退款原因 *</label>
            <input type="text" id="refundReason" placeholder="例如：无法登录、交付异常、配置不符" />
          </div>
          <div class="form-group">
            <label>补充说明</label>
            <textarea id="refundContent" rows="4" placeholder="可填写更详细的问题描述、报错信息、已尝试的处理方式等"></textarea>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" style="flex: 1" onclick="closeRefundModal()">取消</button>
          <button class="btn btn-primary" style="flex: 1" onclick="submitRefundRequest()">提交退款申请</button>
        </div>
      </div>
    </div>
