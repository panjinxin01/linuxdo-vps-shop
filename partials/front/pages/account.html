<!-- 我的账户页（余额 / 流水） -->
<!-- 来源：index.html · 由 js/core/partials.js 同步注入，请勿在此文件内写 <script> -->
      <!-- ============ 我的账户页 ============ -->
      <div class="page-content" id="page-orders">
        <div class="container">
          <div class="page-header">
            <h2>我的账户</h2>
            <p>管理您的VPS订单、余额与服务</p>
          </div>
          <div class="account-summary-grid">
            <div class="card balance-card">
              <div class="stat-label">我的余额</div>
              <div class="balance-value" id="creditBalanceSummary">--</div>
              <div class="balance-hint" id="creditBalanceHint">余额可用于支付订单</div>
            </div>
            <div class="card tx-card">
              <div class="tx-head">
                <div class="stat-label">最近积分流水</div>
                <button class="btn btn-outline btn-sm" onclick="loadCreditTransactions()">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                  刷新
                </button>
              </div>
              <div id="creditTransactions" class="tx-list">暂无流水</div>
            </div>
          </div>
          <div id="myOrders"></div>
        </div>
      </div>
