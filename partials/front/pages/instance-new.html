<!-- 新建实例页（商品筛选 + 列表） -->
<!-- 来源：index.html · 由 js/core/partials.js 同步注入，请勿在此文件内写 <script> -->
      <!-- ============ 新建实例页 ============ -->
      <div class="page-content" id="page-buy">
        <div class="container">
          <div class="page-header">
            <h2>新建实例</h2>
            <p>按地区与配置筛选所需的 VPS 实例，支持优惠券自动计算与智能支付</p>
          </div>
          <div class="filter-toolbar" id="productFilterToolbar" style="display: none">
            <div class="filter-chips" id="productRegionChips">
              <button type="button" class="filter-chip active" data-region="all" onclick="setProductRegionFilter('all')">全部地区</button>
            </div>
            <div class="filter-search-wrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input type="text" id="productSearchInput" class="filter-search-input" placeholder="搜索节点名称、CPU、线路或系统..." oninput="onProductSearchInput(this.value)" />
            </div>
          </div>
          <div class="products" id="buyProductList"></div>
        </div>
      </div>
