      <!-- ============ 通知中心页 ============ -->
      <div class="page-content" id="page-notifications">
        <div class="container">
          <div class="page-header">
            <h2>通知中心</h2>
            <p>查看所有系统通知和消息</p>
          </div>
          <div class="notification-page-actions">
            <div class="notification-page-filter">
              <button class="btn btn-sm" id="notifFilterAll" onclick="loadNotificationPage('all')">全部</button>
              <button class="btn btn-sm" id="notifFilterUnread" onclick="loadNotificationPage('unread')">未读</button>
            </div>
            <button class="btn btn-sm" onclick="markAllNotificationsReadPage()">全部已读</button>
          </div>
          <div id="notificationPageList"></div>
          <div id="notificationPagePagination" style="text-align: center; margin-top: 20px"></div>
        </div>
      </div>
