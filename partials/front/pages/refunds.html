<!-- 退款售后页 -->
<!-- 来源：index.html · 由 js/core/partials.js 同步注入，请勿在此文件内写 <script> -->
      <!-- ============ 退款售后页 ============ -->
      <div class="page-content" id="page-refunds">
        <div class="container">
          <div class="page-header section-head">
            <div>
              <h2>退款售后</h2>
              <p>管理可退款订单、申请按剩余时长退款并跟踪售后审批进度</p>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button type="button" class="btn btn-outline btn-sm" onclick="loadMyRefunds()">刷新记录</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="switchPage('orders')">我的订单</button>
            </div>
          </div>

          <div class="rf-kpi-grid" id="frontRefundKpis">
            <div class="rf-kpi-card">
              <div class="rf-kpi-label">可申请退款订单</div>
              <div class="rf-kpi-value" id="frontRfEligibleCount">0</div>
              <div class="rf-kpi-sub">支持按剩余时长实时核算金额</div>
            </div>
            <div class="rf-kpi-card">
              <div class="rf-kpi-label">售后审核中工单</div>
              <div class="rf-kpi-value" id="frontRfPendingCount">0</div>
              <div class="rf-kpi-sub">管理员审核后自动原路或余额退回</div>
            </div>
            <div class="rf-kpi-card">
              <div class="rf-kpi-label">累计已退积分</div>
              <div class="rf-kpi-value" id="frontRfRefundedSum">0.00</div>
              <div class="rf-kpi-sub">含已完结订单与售后审批退款</div>
            </div>
          </div>

          <div class="rf-hub-bar">
            <div class="rf-hub-tabs" id="frontRefundFilterTabs">
              <button type="button" class="rf-hub-tab active" data-filter="all" onclick="setFrontRefundFilter('all', this)">全部售后</button>
              <button type="button" class="rf-hub-tab" data-filter="eligible" onclick="setFrontRefundFilter('eligible', this)">可申请退款</button>
              <button type="button" class="rf-hub-tab" data-filter="tickets" onclick="setFrontRefundFilter('tickets', this)">退款工单进度</button>
              <button type="button" class="rf-hub-tab" data-filter="refunded" onclick="setFrontRefundFilter('refunded', this)">已退款订单</button>
            </div>
            <div class="rf-search-wrap">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" class="rf-search-input" id="frontRefundSearchInput" placeholder="搜索订单号 / 商品 / 原因..." oninput="renderMyRefunds()" />
            </div>
          </div>

          <div id="myRefunds"></div>
        </div>
      </div>
